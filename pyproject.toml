[project]
name = "nyc311-operational-analytics"
version = "0.1.0"
description = "Riesgo de cierre tardío, pronóstico de volumen y pipeline sobre NYC 311"
readme = "README.md"
authors = [
    { name = "Junior Jimenez", email = "juniorelias049@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
nyc311-operational-analytics = "nyc311_operational_analytics:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
